name: Refresh media

# Monthly check of every preview URL (Apple sometimes moves the files). Dead ones are
# re-resolved and the result is proposed as a pull request: nothing is pushed to main,
# a person reviews and merges, and the merge triggers the normal deploy.
on:
  schedule:
    - cron: '17 6 3 * *' # 06:17 UTC on the 3rd of each month
  workflow_dispatch:

permissions:
  contents: write # push the proposal branch (never main)
  pull-requests: write

concurrency:
  group: refresh-media
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run media -- --check-previews
      - name: Open a pull request if media changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/data; then
            echo "All previews alive, nothing to propose."
            exit 0
          fi
          branch="refresh-media/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add src/data/media.art.json src/data/media.previews.json
          git commit -m "Refresh media: re-resolve dead previews"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Atualizar prévias quebradas ($(date -u +%Y-%m-%d))" \
            --body "A checagem mensal (\`npm run media -- --check-previews\`) encontrou prévias que não respondem mais e as resolveu de novo. Revise o diff de \`src/data/media.previews.json\` e faça o merge para publicar."
